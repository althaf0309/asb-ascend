    <!-- Analytics
         GTM and gtag were loading in the head and blocking the main thread for
         ~1s on mobile. The queue (dataLayer/gtag) is set up immediately so no
         events are lost, but the container itself is fetched after first paint,
         or on the first interaction - whichever comes first. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      (function () {
        var loaded = false;
        function loadAnalytics() {
          if (loaded) return;
          loaded = true;

          // Only the GTM container is loaded here. It already configures
          // G-1MSBPYNK3L (and G-NJCYZDHX8T), so the standalone gtag.js snippet
          // that used to sit alongside it was fetching the same 168KB library
          // for the same property a second time.
          window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var gtm = document.createElement('script');
          gtm.async = true;
          gtm.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-W7JXM8VD';
          document.head.appendChild(gtm);
        }

        // Whichever comes first: the page settling, or the visitor doing
        // something. The interaction listeners matter for bounce tracking on
        // slow connections where load fires late.
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
          window.addEventListener(evt, loadAnalytics, { once: true, passive: true });
        });

        if (document.readyState === 'complete') {
          setTimeout(loadAnalytics, 1200);
        } else {
          window.addEventListener('load', function () { setTimeout(loadAnalytics, 1200); });
        }
      })();
    </script>
